name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: tmux version
        run: tmux -V

      - name: version metadata agrees
        run: |
          test "$(cat VERSION)" = "$(python -c 'import claudemux; print(claudemux.__version__)')"
          grep -q "^## $(cat VERSION)$" CHANGELOG.md

      - name: end-to-end (create, list, kill a real session)
        run: |
          printf '#!/bin/sh\nsleep 60\n' > /tmp/fake-claude && chmod +x /tmp/fake-claude
          export CLAUDE_BIN=/tmp/fake-claude
          # Pinned, or the name would depend on whatever the runner is called.
          export CLAUDEMUX_SERVER=citest
          python claudemux.py --detach -n ci
          python claudemux.py -l | grep -q "claude-citest-$(id -un)-ci"
          python claudemux.py -l --json |
            CLAUDEMUX_EXPECT="claude-citest-$(id -un)-ci" python -c \
              'import json,os,sys; assert json.load(sys.stdin)[0]["name"] == os.environ["CLAUDEMUX_EXPECT"]'
          python claudemux.py -k ci

      - name: end-to-end (a session from an older scheme still reattaches)
        run: |
          printf '#!/bin/sh\nsleep 60\n' > /tmp/fake-claude && chmod +x /tmp/fake-claude
          export CLAUDE_BIN=/tmp/fake-claude
          export CLAUDEMUX_SERVER=citest
          # Named the way 1.2 would have named it, by hand.
          tmux new-session -d -s "claude-$(id -un)-old" "sleep 60"
          python claudemux.py --detach -n old |
            grep -q "Reattaching to existing session: claude-$(id -un)-old"
          python claudemux.py -k old          # resolve() must find it too
          ! tmux has-session -t "=claude-$(id -un)-old" 2>/dev/null

      - name: diagnostics (only when something broke)
        if: failure()
        run: |
          export CLAUDE_BIN=/tmp/fake-claude
          python claudemux.py --detach -n diag || true
          echo "--- tmux list-sessions ---"; tmux ls || true
          echo "--- raw format output ---"
          tmux list-sessions -F '#{session_name}|#{session_windows}|#{session_attached}|#{session_created}|#{session_activity}|#{pane_current_path}|#{pane_current_command}|#{pane_pid}' || true
          echo "--- claudemux -l ---"; python claudemux.py -l || true

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh
