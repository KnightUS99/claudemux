name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: unit tests
        run: python -m unittest discover -s tests -v
      - name: end-to-end (create, list, kill a real session)
        run: |
          printf '#!/bin/sh\nsleep 60\n' > /tmp/fake-claude && chmod +x /tmp/fake-claude
          export CLAUDE_BIN=/tmp/fake-claude
          python claudemux.py --detach -n ci
          python claudemux.py -l | grep -q "claude-$(id -un)-ci"
          python claudemux.py -l --json | python -c 'import json,sys; assert json.load(sys.stdin)[0]["name"].endswith("-ci")'
          python claudemux.py -k ci

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh
